<div id="home" class="relative min-h-screen text-[#fcf7e8] flex flex-col justify-center bg-cover bg-center" style="background-image: url('{{ "/assets/images/group-photo.jpg" | relative_url }}');">
    <div class="absolute inset-0 bg-[#802126] opacity-10"></div>
    <div class="absolute inset-0 hero-scrim"></div>

    <div class="relative z-10 mx-auto px-4 sm:px-6 lg:px-12 w-full pt-[23.89px] md:pt-[23.89px] pb-12">
        <div data-aos="fade-up" class="flex flex-col items-center md:items-start">
            <img
                src="{{ '/assets/images/logo/Logo-Cream.svg' | relative_url }}"
                alt="Rubycon"
                width="750"
                height="125"
                class="block h-auto w-[calc(100vw-48px)] max-w-[750.288px] mx-auto md:mx-0 md:w-[min(750.288px,calc(100vw-96px))]"
                style="aspect-ratio: 750.2882690429688 / 125.29768371582031;"
            >

            <div class="hero-copy mt-10 md:mt-12 w-full max-w-[720px] text-center md:text-left">
                <p class="hero-copy__kicker mb-4">Rimini &middot; 8 May 2026</p>
                <h1 class="hero-copy__title mb-6">Thank you for crossing the Rubicon with us.</h1>
                <p class="hero-copy__lead mb-10">
                    The talks are online. Rubycon will be back in 2028: in 2027 the team is busy bringing <i>Euruko</i> to Modena.
                </p>

                <div class="flex flex-wrap gap-4 md:gap-6 justify-center md:justify-start">
                    <a href="#euruko" class="hero-btn hero-btn--primary">Euruko 2027</a>
                    <a href="{{ site.event.rubyevents_url }}" target="_blank" rel="noopener" class="hero-btn hero-btn--secondary">Watch the sessions</a>
                </div>
            </div>
        </div>
    </div>

    <!-- Decorative Down Arrow -->
    <div class="absolute bottom-12 left-1/2 -translate-x-1/2 opacity-40">
        <img src="{{ '/assets/images/arrow.svg' | relative_url }}" alt="Scroll down" class="h-8 w-8 md:h-10 md:w-10" loading="lazy" decoding="async">
    </div>
</div>
